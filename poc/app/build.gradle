plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
}
android {
  namespace "com.fe9.poc"
  compileSdk 34
  ndkVersion "27.2.12479018"
  defaultConfig {
    applicationId "com.fe9.poc"
    minSdk 26
    targetSdk 34
    versionCode 1
    versionName "0.1"
    externalNativeBuild { cmake { abiFilters "arm64-v8a" } }
  }
  externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
  buildFeatures { prefab true }
  sourceSets { main { assets.srcDirs = ["../../assets"] } }
  buildTypes { release { minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = "17" }
}
dependencies {
  implementation "com.google.oboe:oboe:1.9.0"
  implementation "androidx.core:core-ktx:1.13.1"
}
